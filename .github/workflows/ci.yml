name: KYRON OS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - p0-security-integrity-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyron-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security and regression tests
        id: tests
        continue-on-error: true
        shell: bash
        run: npm test -- --reporter=verbose > test-output.txt 2>&1

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-1-test-output
          path: test-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck / lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
