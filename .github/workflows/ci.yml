name: KYRON OS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyron-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security and regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=verbose 2>&1 | tee test-output.txt

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: test-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck / lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.txt

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output-${{ github.run_id }}
          path: lint-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Build
        env:
          VITE_GIT_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Production smoke test
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          SMOKE_PORT: 3199
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee smoke-output.txt

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output-${{ github.run_id }}
          path: smoke-output.txt
          if-no-files-found: ignore
          retention-days: 7
