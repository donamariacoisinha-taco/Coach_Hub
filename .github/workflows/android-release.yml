name: Android release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyron-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Require signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ANDROID_KEYSTORE_BASE64}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${ANDROID_KEY_ALIAS}" ] || missing+=("ANDROID_KEY_ALIAS")
          [ -n "${ANDROID_KEY_PASSWORD}" ] || missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Faltam secrets de assinatura Android: ${missing[*]}. Crie o keystore na sua máquina e cadastre os quatro secrets. Veja docs/ANDROID_RELEASE.md."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_API_BASE_URL: https://kyron.uno
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdline-tools-unzip
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools-unzip/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/kyron-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$KEYSTORE"
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 não gerou um arquivo de keystore. O valor deve ser só o base64 do arquivo, sem senha."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Assemble signed release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: kyron-android-release-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
