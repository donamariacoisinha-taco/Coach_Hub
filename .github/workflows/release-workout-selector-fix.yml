name: Release workout selector fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[trigger workout selector release v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply minimal safe selector fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/features/workout/WorkoutPlayer.tsx')
          s = p.read_text()

          old_ui = 'className="flex gap-2 overflow-x-auto no-scrollbar pb-3 mb-4 shrink-0"'
          new_ui = 'className="grid grid-cols-3 gap-2 pb-3 mb-4 shrink-0"'
          if old_ui not in s:
              raise SystemExit('filter UI marker not found')
          s = s.replace(old_ui, new_ui, 1)

          old_match = "const muscleMatches = !selectedMuscleGroup || selectedMuscleGroup === 'Tudo' || ex.muscle_group === selectedMuscleGroup || (selectedMuscleGroup === 'Cardio' && (ex.muscle_group || \"\").toLowerCase().includes('cardio'));"
          new_match = "const normalizeMuscle = (value: unknown) => String(value || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase().trim();\n      const selectedMuscle = normalizeMuscle(selectedMuscleGroup);\n      const exerciseMuscle = normalizeMuscle(ex.muscle_group);\n      const muscleMatches = !selectedMuscle || selectedMuscle === 'tudo' || exerciseMuscle.includes(selectedMuscle) || selectedMuscle.includes(exerciseMuscle);"
          if old_match not in s:
              raise SystemExit('muscle match marker not found')
          s = s.replace(old_match, new_match, 1)

          old_search = '(ex.equipment && ex.equipment.toLowerCase().includes(searchQuery.toLowerCase()));'
          new_search = '(ex.equipment && ex.equipment.toLowerCase().includes(searchQuery.toLowerCase())) ||\n                          ((ex.muscle_group || "").normalize(\'NFD\').replace(/[\\u0300-\\u036f]/g, \'\').toLowerCase().includes(searchQuery.normalize(\'NFD\').replace(/[\\u0300-\\u036f]/g, \'\').toLowerCase()));'
          if old_search not in s:
              raise SystemExit('search marker not found')
          s = s.replace(old_search, new_search, 1)

          p.write_text(s)
          PY

      - name: Commit fix and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/release-workout-selector-fix.yml .github/workout-selector-release-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/workout/WorkoutPlayer.tsx .github/workflows/release-workout-selector-fix.yml .github/workout-selector-release-trigger.txt
          git commit -m "Fix workout exercise selector filters (#30)"
          git push origin main
