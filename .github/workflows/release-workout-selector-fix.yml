name: Release workout selector fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ contains(github.event.head_commit.message, '[trigger workout selector release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply selector patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/workout/WorkoutPlayer.tsx')
          text = path.read_text()

          old_filter = '''  const filteredSelectorExercises = useMemo(() => {
    if (!allAvailableExercises) return [];
    return allAvailableExercises.filter(ex => {
      const nameMatches = (ex.name || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
                          (ex.description && ex.description.toLowerCase().includes(searchQuery.toLowerCase())) ||
                          (ex.equipment && ex.equipment.toLowerCase().includes(searchQuery.toLowerCase()));
      
      const muscleMatches = !selectedMuscleGroup || selectedMuscleGroup === 'Tudo' || ex.muscle_group === selectedMuscleGroup || (selectedMuscleGroup === 'Cardio' && (ex.muscle_group || "").toLowerCase().includes('cardio'));
      
      return nameMatches && muscleMatches;
    });
  }, [allAvailableExercises, searchQuery, selectedMuscleGroup]);'''

          new_filter = '''  const normalizeSelectorValue = (value: unknown) =>
    String(value || '')
      .normalize('NFD')
      .replace(/[\\u0300-\\u036f]/g, '')
      .toLowerCase()
      .trim();

  const availableEquipment = useMemo(() => {
    const equipment = new Set<string>();
    (allAvailableExercises || []).forEach((ex) => {
      if (ex?.equipment) equipment.add(String(ex.equipment).trim());
    });
    return ['Todos', ...Array.from(equipment).sort((a, b) => a.localeCompare(b, 'pt-BR'))];
  }, [allAvailableExercises]);

  const filteredSelectorExercises = useMemo(() => {
    if (!allAvailableExercises) return [];

    const normalizedSearch = normalizeSelectorValue(searchQuery);
    const normalizedMuscle = normalizeSelectorValue(selectedMuscleGroup);
    const normalizedEquipment = normalizeSelectorValue(selectedEquipment);

    return allAvailableExercises.filter((ex) => {
      const searchableText = normalizeSelectorValue([
        ex.name,
        ex.description,
        ex.equipment,
        ex.muscle_group
      ].filter(Boolean).join(' '));

      const exerciseMuscle = normalizeSelectorValue(ex.muscle_group);
      const exerciseEquipment = normalizeSelectorValue(ex.equipment);

      const nameMatches = !normalizedSearch || searchableText.includes(normalizedSearch);
      const muscleMatches = !normalizedMuscle || normalizedMuscle === 'tudo' ||
        exerciseMuscle.includes(normalizedMuscle) || normalizedMuscle.includes(exerciseMuscle);
      const equipmentMatches = !normalizedEquipment || normalizedEquipment === 'todos' ||
        exerciseEquipment.includes(normalizedEquipment) || normalizedEquipment.includes(exerciseEquipment);

      return nameMatches && muscleMatches && equipmentMatches;
    });
  }, [allAvailableExercises, searchQuery, selectedMuscleGroup, selectedEquipment]);'''

          if old_filter not in text:
            raise SystemExit('Expected selector filter block was not found')
          text = text.replace(old_filter, new_filter, 1)

          old_pills = '''                  {/* Horizontal Scroll Filter Pills */}
                  <div className="flex gap-2 overflow-x-auto no-scrollbar pb-3 mb-4 shrink-0">
                    {/* Muscle Groups Pills */}
                    {['Tudo', 'Peito', 'Costas', 'Quadríceps', 'Glúteo', 'Ombro', 'Bíceps', 'Tríceps', 'Cardio'].map((cat) => {
                      const isActive = selectedMuscleGroup === cat;
                      return (
                        <button
                          key={cat}
                          onClick={() => {
                            setSelectedMuscleGroup(cat);
                            playHapticFeedback('light');
                          }}
                          className={`px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider transition-all whitespace-nowrap border ${
                            isActive 
                              ? "bg-slate-900 text-white border-slate-950" 
                              : "bg-slate-50 text-slate-400 border-slate-100 hover:bg-slate-100"
                          }`}
                        >
                          {cat}
                        </button>
                      );
                    })}
                  </div>'''

          new_pills = '''                  {/* Responsive selector filters */}
                  <div className="mb-4 shrink-0 space-y-3">
                    <div className="grid grid-cols-3 gap-2">
                      {['Tudo', 'Peito', 'Costas', 'Quadríceps', 'Glúteo', 'Ombro', 'Bíceps', 'Tríceps', 'Cardio'].map((cat) => {
                        const isActive = selectedMuscleGroup === cat;
                        return (
                          <button
                            key={cat}
                            onClick={() => {
                              setSelectedMuscleGroup(cat);
                              playHapticFeedback('light');
                            }}
                            className={`min-h-9 px-2 py-1.5 rounded-xl text-[9px] font-black uppercase tracking-wide transition-all border ${
                              isActive
                                ? "bg-slate-900 text-white border-slate-950"
                                : "bg-slate-50 text-slate-500 border-slate-100 hover:bg-slate-100"
                            }`}
                          >
                            {cat}
                          </button>
                        );
                      })}
                    </div>

                    <div className="flex items-center gap-2">
                      <Filter size={14} className="text-slate-400 shrink-0" />
                      <select
                        value={selectedEquipment}
                        onChange={(e) => setSelectedEquipment(e.target.value)}
                        className="w-full h-10 px-3 bg-slate-50 border border-slate-100 rounded-xl text-[10px] font-black uppercase tracking-wide text-slate-600 focus:outline-none focus:ring-2 focus:ring-[#7BA7FF]/30"
                        aria-label="Filtrar por equipamento"
                      >
                        {availableEquipment.map((equipment) => (
                          <option key={equipment} value={equipment}>{equipment}</option>
                        ))}
                      </select>
                    </div>
                  </div>'''

          if old_pills not in text:
            raise SystemExit('Expected muscle filter UI block was not found')
          text = text.replace(old_pills, new_pills, 1)

          # Reset stale selector filters when opening add/replace mode.
          text = text.replace("setExerciseSelectorMode('replace');\n                                        setContextMenuIndex(null);",
                              "setSearchQuery('');\n                                        setSelectedMuscleGroup('Tudo');\n                                        setSelectedEquipment('Todos');\n                                        setExerciseSelectorMode('replace');\n                                        setContextMenuIndex(null);")
          text = text.replace("setExerciseSelectorMode('replace');\n                                        setShowExercisesList(true);",
                              "setSearchQuery('');\n                                        setSelectedMuscleGroup('Tudo');\n                                        setSelectedEquipment('Todos');\n                                        setExerciseSelectorMode('replace');\n                                        setShowExercisesList(true);")
          text = text.replace("setExerciseSelectorMode('add');",
                              "setSearchQuery('');\n                            setSelectedMuscleGroup('Tudo');\n                            setSelectedEquipment('Todos');\n                            setExerciseSelectorMode('add');")

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run lint

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Commit release
        shell: bash
        run: |
          rm -f .github/workflows/release-workout-selector-fix.yml .github/workout-selector-release-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/workout/WorkoutPlayer.tsx .github/workflows/release-workout-selector-fix.yml .github/workout-selector-release-trigger.txt
          git commit -m "Fix workout exercise selector filters (#30)"
          git push origin main
